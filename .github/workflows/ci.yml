name: CI

on:
  # Branch pushes are covered by the pull_request event. Limiting push to the
  # default branch keeps a commit on a branch with an open PR from starting two
  # concurrent runs that compete for the same runner.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # head_ref is the source branch on a pull_request and empty otherwise, so a
  # branch groups under one key instead of splitting between refs/heads/<branch>
  # and refs/pull/<n>/merge.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  swiftpm-tests:
    name: SwiftPM tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Verify Xcode 26 or newer
        run: |
          # README states a minimum, so the gate enforces a minimum. Matching
          # `^Xcode 26` exactly turned every future runner-image bump into a
          # red build with nothing actually wrong.
          xcodebuild -version
          version="$(xcodebuild -version | head -n 1 | awk '{print $2}')"
          major="${version%%.*}"
          if [ "$major" -lt 26 ]; then
            echo "Xcode $version is older than the required 26" >&2
            exit 1
          fi
      - name: Run SwiftPM tests
        run: swift test --scratch-path .derivedData/swiftpm

  xcode-app-tests:
    name: Xcode app and tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Verify Xcode 26 or newer
        run: |
          # README states a minimum, so the gate enforces a minimum. Matching
          # `^Xcode 26` exactly turned every future runner-image bump into a
          # red build with nothing actually wrong.
          xcodebuild -version
          version="$(xcodebuild -version | head -n 1 | awk '{print $2}')"
          major="${version%%.*}"
          if [ "$major" -lt 26 ]; then
            echo "Xcode $version is older than the required 26" >&2
            exit 1
          fi
      - name: Build app and run tests
        run: |
          xcodebuild test \
            -project MeetingScribe.xcodeproj \
            -scheme MeetingScribe \
            -destination 'platform=macOS' \
            -derivedDataPath .derivedData/xcode-ci \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=
